<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Portal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="brand">ANIME PORTAL</div>
    <div class="owner-logo-btn" onclick="openAuthModal()" title="Owner Access">
      <img src="https://i.ibb.co/Hfqs1G0r/d794b2ec-a653-4e79-850b-ef789efa8433.jpg" alt="Anime Portal Logo" class="brand-logo-img">
    </div>
  </header>

  <main class="container">
    
    <!-- Cinema Player Box with Inside Overlay Controls -->
    <section class="player-container" id="playerBox">
      <div class="video-viewport" id="viewport">
        <div class="media-host" id="mediaHost"></div>
        
        <!-- Video Screen Right Most Corner Sleek Overlay Buttons -->
        <div class="video-overlay-bar">
          <button class="v-btn" id="prevEpBtn" onclick="changeEpisode(-1)" title="Previous Episode">⏮</button>
          <button class="v-btn" onclick="toggleFullScreen()" title="Fullscreen">⛶</button>
          <button class="v-btn" id="nextEpBtn" onclick="changeEpisode(1)" title="Next Episode">⏭</button>
        </div>
      </div>

      <div class="player-meta">
        <h2 class="current-title" id="currentAnimeTitle">Anime Title</h2>
        <div class="current-episode" id="currentEpTitle">Episode 1 • Now Streaming</div>
        <div class="ep-chips" id="epChipsContainer"></div>
      </div>
    </section>

    <!-- Continue Watching Section -->
    <div id="continueWatchingBox" style="display: none; margin-bottom: 24px;">
      <div class="catalog-heading" style="color: #00f2fe; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span>CONTINUE WATCHING</span>
        <button onclick="clearWatchHistory()" style="background: none; border: none; color: var(--text-muted, #7e8b9b); font-size: 0.75rem; cursor: pointer;">Clear</button>
      </div>
      <div id="continueCard" class="continue-card"></div>
    </div>

    <!-- Super Search Bar -->
    <div class="search-box">
      <input type="text" id="searchInput" class="search-input" placeholder="Search Tamil anime or genre..." oninput="handleSearch()">
    </div>

    <!-- Anime Grid Catalog -->
    <div class="catalog-heading">TAMIL DUBBED COLLECTION</div>
    <div class="anime-grid" id="animeGrid"></div>

  </main>

  <!-- Owner Password Modal -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <h2>Owner Access</h2>
      <div class="form-group">
        <label>Enter Master Password</label>
        <input type="password" id="authPassword" placeholder="Owner key...">
      </div>
      <div class="error-msg" id="authError">Access Denied: Wrong Password</div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeAllModals()">Cancel</button>
        <button class="btn-submit" onclick="verifyOwner()">Unlock</button>
      </div>
    </div>
  </div>

  <!-- Owner Dashboard Modal with Dropdown Continuation -->
  <div class="modal-overlay" id="masterModal">
    <div class="modal-box master-box">
      <h2>Owner Studio</h2>
      
      <!-- Smart Upload Section -->
      <div class="upload-section">
        
        <div class="form-group">
          <label>Select Anime</label>
          <select id="animeSelectDropdown" onchange="handleAnimeDropdownChange()">
            <option value="NEW">+ Add New Anime</option>
          </select>
        </div>

        <div class="form-group" id="titleInputGroup">
          <label>Anime Title</label>
          <input type="text" id="upTitle" placeholder="Anime Name">
        </div>

        <div class="form-group" id="posterInputGroup">
          <label>Poster Image URL</label>
          <input type="text" id="upPoster" placeholder="https://image-link.jpg">
        </div>

        <div class="form-group" id="genreInputGroup">
          <label>Genre</label>
          <input type="text" id="upGenre" placeholder="Action, Adventure">
        </div>

        <div class="form-group">
          <label>Episode Number</label>
          <input type="number" id="upEpNum" value="1">
        </div>

        <div class="form-group">
          <label>Stream / Direct Video URL</label>
          <input type="text" id="upStreamUrl" placeholder="Direct Heroku / Stream link">
        </div>
        
        <button class="btn-submit" style="width: 100%; margin-top: 10px;" onclick="submitNewContent()">Publish Episode</button>
      </div>

      <hr style="border: 0; border-top: 1px solid var(--surface-border, #1f2533); margin: 18px 0;">

      <!-- Manage & Remove Section -->
      <h3 style="font-size: 0.9rem; color: var(--accent, #00f2fe); margin-bottom: 10px;">Manage Anime (Remove)</h3>
      <div id="manageList" class="manage-list"></div>

      <div class="modal-btns" style="margin-top: 16px;">
        <button class="btn-cancel" style="width: 100%;" onclick="closeAllModals()">Close</button>
      </div>
    </div>
  </div>

  <!-- Firebase Compatibility SDK Scripts (Always First) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <!-- App Custom Logic (After Firebase) -->
  <script src="script.js"></script>
</body>
</html>
